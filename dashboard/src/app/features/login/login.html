<xa-fondo-login />
<main class="login">
  <p class="login__salud" aria-live="polite">
    <xa-badge [tono]="chipSalud().tono">{{ chipSalud().texto }}</xa-badge>
  </p>
  <section class="login__tarjeta" aria-labelledby="login-titulo">
    <div class="login__marca">
      <xa-marca variante="login" />
    </div>
    <p class="login__proposito">{{ textosApi.proposito }}</p>
    <h1 id="login-titulo" class="solo-lector">{{ textos.tituloPagina }}</h1>

    <form class="login__formulario" [formGroup]="formulario" (ngSubmit)="entrar()" novalidate>
      <xa-campo [etiqueta]="textos.email" para="login-email" [error]="errorEmail()">
        <input
          id="login-email"
          type="email"
          formControlName="email"
          autocomplete="username"
          inputmode="email"
          [attr.aria-invalid]="errorEmail() ? true : null"
          [attr.aria-describedby]="errorEmail() ? 'login-email-error' : null"
        />
      </xa-campo>

      <xa-campo [etiqueta]="textos.password" para="login-password" [error]="errorPassword()">
        <input
          id="login-password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          [attr.aria-invalid]="errorPassword() ? true : null"
          [attr.aria-describedby]="errorPassword() ? 'login-password-error' : null"
        />
      </xa-campo>

      <div class="login__avisos" aria-live="polite">
        @if (errorGeneral(); as error) {
          <p class="login__error" role="alert">{{ error }}</p>
        }
        @if (enviando() && estadoApi.despertando()) {
          <p class="login__despertando">{{ textosApi.despertando }}</p>
        }
      </div>

      <button xa-boton type="submit" variante="primario" [bloque]="true" [cargando]="enviando()">
        {{ enviando() ? textos.entrando : textos.entrar }}
      </button>
    </form>
  </section>
</main>
